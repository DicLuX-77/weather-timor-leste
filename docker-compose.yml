
services:

  # ==========================================================
  # 1. APACHE KAFKA
  # ==========================================================

  kafka:
    image: apache/kafka:4.1.0
    container_name: timor-kafka
    restart: unless-stopped

    ports:
      - "127.0.0.1:29092:29092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s


  # ==========================================================
  # 2. MONGODB
  # ==========================================================

  mongodb:
    image: mongo:8.0
    container_name: timor-mongodb
    restart: unless-stopped

    ports:
      - "127.0.0.1:27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME belum diisi}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD belum diisi}

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 }).ok"'
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s


  # ==========================================================
  # 3. KAFKA CONSUMER
  # ==========================================================

  consumer:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: timor-consumer
    restart: unless-stopped

    command: python consumer/mongo_consumer.py

    environment:
      MONGO_URI: ${MONGO_URI_DOCKER:?MONGO_URI_DOCKER belum diisi di .env}
      MONGO_DB_NAME: weather_timor
      MONGO_COLLECTION: weather_air_quality

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: weather_timor

    depends_on:
      kafka:
        condition: service_healthy

      mongodb:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - test -f /tmp/consumer-ready
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s


  # ==========================================================
  # 4. AUTO SCHEDULER
  # ==========================================================

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: timor-scheduler
    restart: unless-stopped

    command: python scheduler/auto_collector.py

    env_file:
      - .env

    environment:
      MONGO_URI: ${MONGO_URI_DOCKER:?MONGO_URI_DOCKER belum diisi di .env}
      MONGO_DB_NAME: weather_timor
      MONGO_COLLECTION: weather_air_quality

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: weather_timor

      INTERVAL: ${INTERVAL:-30}
      META_DADUS: ${META_DADUS:-10000}

    depends_on:
      kafka:
        condition: service_healthy

      mongodb:
        condition: service_healthy

      consumer:
        condition: service_healthy


  # ==========================================================
  # 5. FLASK DASHBOARD
  # ==========================================================

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: timor-dashboard
    restart: unless-stopped

    command: python dashboard/app.py

    env_file:
      - .env

    environment:
      MONGO_URI: ${MONGO_URI_DOCKER:?MONGO_URI_DOCKER belum diisi di .env}
      MONGO_DB_NAME: weather_timor
      MONGO_COLLECTION: weather_air_quality

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: weather_timor

      FLASK_PORT: 5000
      META_DADUS: ${META_DADUS:-10000}

      ENABLE_MANUAL_COLLECTION: "false"

    ports:
      - "5000:5000"

    depends_on:
      mongodb:
        condition: service_healthy


# ============================================================
# 6. PERSISTENT VOLUMES
# ============================================================

volumes:
  kafka_data:
    name: timor_kafka_data

  mongodb_data:
    name: timor_mongodb_data
